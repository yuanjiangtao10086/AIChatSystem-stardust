spring.datasource.url=jdbc:h2:mem:stardust;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
logging.level.org.hibernate.SQL=warn
app.security.jwt-secret-base64=dGVzdC1vbmx5LWp3dC1zZWNyZXQtdGhhdC1pcy1hdC1sZWFzdC0zMi1ieXRlcw==
app.security.jwt-issuer=stardust-test
app.security.access-token-ttl=PT5M
app.security.refresh-token-ttl=P30D
app.security.refresh-token-pepper=test-only-refresh-token-pepper-at-least-32-bytes
app.security.refresh-cookie-secure=false
app.security.refresh-cookie-same-site=Lax
app.ai.service.base-url=http://127.0.0.1:8000
app.ai.service.token=test-only-internal-ai-service-token-123456789
app.ai.service.connect-timeout=PT1S
app.ai.service.request-timeout=PT5S
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
app.storage.provider=local
app.storage.local-root=${java.io.tmpdir}/stardust-test-files
app.storage.max-file-bytes=26214400
app.storage.default-quota-bytes=1073741824
app.ai.usage.quota-tokens=2000000
app.ai.usage.quota-cost=20
app.ai.usage.currency=USD
app.ai.usage.output-reserve-tokens=4096
app.ai.usage.period-days=30
app.ai.usage.reconcile-initial-delay-ms=3600000
app.ai.usage.reconcile-interval-ms=3600000
app.ai.usage.reserve-sweep-window-hours=24
app.security.rate-limit.login-max-failures=100
app.security.rate-limit.login-window=PT10M
app.security.rate-limit.login-block=PT1S
app.security.rate-limit.store=memory
app.security.rate-limit.register-max-attempts=100
app.security.rate-limit.register-window=PT10M
app.security.rate-limit.register-block=PT1S
app.security.rate-limit.refresh-max-attempts=100
app.security.rate-limit.refresh-window=PT5M
app.security.rate-limit.refresh-block=PT1S
app.security.rate-limit.upload-max-requests=100
app.security.rate-limit.upload-window=PT1M
app.security.rate-limit.upload-block=PT1S
app.security.rate-limit.trusted-proxies=
