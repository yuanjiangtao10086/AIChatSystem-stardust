server.port=8081

# REST "verb" suffixes (Google AIP-136 style, e.g. /messages:search) are avoided: Spring's default
# PathPatternParser rejects ':' in paths, so endpoints use plain nested paths
# (/messages/search, /messages/{id}/regenerate, /messages/{id}/edit-and-resend, ...).

spring.application.name=stardust_springboot
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=9
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] [%X{traceId:-}] %logger{36} - %msg%n

app.security.jwt-secret-base64=${JWT_SECRET_BASE64}
app.security.jwt-issuer=${JWT_ISSUER:stardust-api}
app.security.access-token-ttl=${ACCESS_TOKEN_TTL:PT15M}
app.security.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
app.security.refresh-token-pepper=${REFRESH_TOKEN_PEPPER}
app.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.security.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

app.ai.service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
app.ai.service.token=${AI_SERVICE_TOKEN:}
app.ai.service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:PT5S}
app.ai.service.request-timeout=${AI_SERVICE_REQUEST_TIMEOUT:PT2M}
app.ai.context.system-prompt=${AI_CONTEXT_SYSTEM_PROMPT:You are a helpful AI assistant.}
app.ai.context.default-context-window=${AI_CONTEXT_DEFAULT_WINDOW:16384}
app.ai.context.default-output-reserve=${AI_CONTEXT_OUTPUT_RESERVE:2048}
app.ai.context.safety-reserve=${AI_CONTEXT_SAFETY_RESERVE:512}
app.ai.context.max-recent-messages=${AI_CONTEXT_MAX_RECENT_MESSAGES:24}
app.ai.context.summary-trigger-messages=${AI_CONTEXT_SUMMARY_TRIGGER_MESSAGES:16}
app.ai.context.summary-trigger-tokens=${AI_CONTEXT_SUMMARY_TRIGGER_TOKENS:8192}
app.ai.context.recent-message-budget=${AI_CONTEXT_RECENT_MESSAGE_BUDGET:4096}
app.ai.context.keep-recent-messages=${AI_CONTEXT_KEEP_RECENT_MESSAGES:8}
app.ai.context.max-summary-tokens=${AI_CONTEXT_MAX_SUMMARY_TOKENS:1024}
app.ai.memory.retrieval-limit=${AI_MEMORY_RETRIEVAL_LIMIT:5}
app.ai.memory.retrieval-candidate-limit=${AI_MEMORY_RETRIEVAL_CANDIDATE_LIMIT:100}
app.ai.memory.token-budget=${AI_MEMORY_TOKEN_BUDGET:512}
app.ai.attachment.max-file-bytes=${AI_ATTACHMENT_MAX_FILE_BYTES:5242880}
app.ai.attachment.max-total-bytes=${AI_ATTACHMENT_MAX_TOTAL_BYTES:20971520}
app.ai.attachment.max-text-chars=${AI_ATTACHMENT_MAX_TEXT_CHARS:60000}
app.ai.attachment.text-mime-types=${AI_ATTACHMENT_TEXT_MIMES:text/plain,text/markdown,text/csv,application/json,text/json}
app.ai.attachment.image-mime-types=${AI_ATTACHMENT_IMAGE_MIMES:image/png,image/jpeg,image/gif,image/webp}
app.ai.attachment.pdf-mime-types=${AI_ATTACHMENT_PDF_MIMES:application/pdf}
app.ai.attachment.image-detail=${AI_ATTACHMENT_IMAGE_DETAIL:auto}
app.ai.rag.provider-key=${AI_RAG_PROVIDER_KEY:openai-compatible}
app.ai.rag.embedding-model=${AI_RAG_EMBEDDING_MODEL:text-embedding-3-small}
app.ai.rag.retrieval-top-k=${AI_RAG_RETRIEVAL_TOP_K:6}
app.ai.rag.retrieval-token-budget=${AI_RAG_RETRIEVAL_TOKEN_BUDGET:1200}
app.ai.usage.quota-tokens=${AI_USAGE_QUOTA_TOKENS:2000000}
app.ai.usage.quota-cost=${AI_USAGE_QUOTA_COST:20}
app.ai.usage.currency=${AI_USAGE_CURRENCY:USD}
app.ai.usage.output-reserve-tokens=${AI_USAGE_OUTPUT_RESERVE_TOKENS:4096}
app.ai.usage.period-days=${AI_USAGE_PERIOD_DAYS:30}
app.ai.usage.reconcile-initial-delay-ms=${AI_USAGE_RECONCILE_INITIAL_DELAY_MS:60000}
app.ai.usage.reconcile-interval-ms=${AI_USAGE_RECONCILE_INTERVAL_MS:3600000}
app.ai.usage.reserve-sweep-window-hours=${AI_USAGE_RESERVE_SWEEP_WINDOW_HOURS:24}
app.security.rate-limit.login-max-failures=${LOGIN_MAX_FAILURES:5}
app.security.rate-limit.login-window=${LOGIN_WINDOW:PT10M}
app.security.rate-limit.login-block=${LOGIN_BLOCK:PT15M}

spring.servlet.multipart.max-file-size=${STORAGE_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${STORAGE_MAX_REQUEST_SIZE:26MB}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-root=${STORAGE_LOCAL_ROOT:./data/files}
app.storage.max-file-bytes=${STORAGE_MAX_FILE_BYTES:26214400}
app.storage.default-quota-bytes=${STORAGE_DEFAULT_QUOTA_BYTES:1073741824}

# Shared / abuse rate limiting (store=memory by default; switch to redis before horizontal scaling)
app.security.rate-limit.store=${RATE_LIMIT_STORE:memory}
app.security.rate-limit.register-max-attempts=${REGISTER_MAX_ATTEMPTS:8}
app.security.rate-limit.register-window=${REGISTER_WINDOW:PT10M}
app.security.rate-limit.register-block=${REGISTER_BLOCK:PT30M}
app.security.rate-limit.refresh-max-attempts=${REFRESH_MAX_ATTEMPTS:20}
app.security.rate-limit.refresh-window=${REFRESH_WINDOW:PT5M}
app.security.rate-limit.refresh-block=${REFRESH_BLOCK:PT15M}
app.security.rate-limit.upload-max-requests=${UPLOAD_MAX_REQUESTS:30}
app.security.rate-limit.upload-window=${UPLOAD_WINDOW:PT1M}
app.security.rate-limit.upload-block=${UPLOAD_BLOCK:PT5M}
app.security.rate-limit.trusted-proxies=${TRUSTED_PROXIES:}

# Redis (only used when app.security.rate-limit.store=redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
app.redis.password-encoded=${REDIS_PASSWORD_ENCODED:false}

# Actuator / observability (prometheus scraped by ADMIN only; see SecurityConfiguration)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
